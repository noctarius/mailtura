name: build-and-publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_tag: mailtura-worker
            dockerfile: docker/Dockerfile
            target: release-mailtura-worker
          - image_tag: mailtura-core
            dockerfile: docker/Dockerfile
            target: release-mailtura-core
          - image_tag: mailtura-init
            dockerfile: docker/Dockerfile.init
            target: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Hub repository
        run: |
          if [ -z "${DOCKERHUB_REPOSITORY}" ]; then
            echo "vars.DOCKERHUB_REPOSITORY is not set"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.image_tag }} (with target)
        if: ${{ matrix.target != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKERHUB_REPOSITORY }}:${{ matrix.image_tag }}

      - name: Build and push ${{ matrix.image_tag }} (without target)
        if: ${{ matrix.target == '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKERHUB_REPOSITORY }}:${{ matrix.image_tag }}
