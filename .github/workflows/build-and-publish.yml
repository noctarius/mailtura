name: build-and-publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}

jobs:
  build-and-push-arch:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image:
          - image_tag: mailtura-worker
            dockerfile: docker/Dockerfile
            target: release-mailtura-worker
          - image_tag: mailtura-core
            dockerfile: docker/Dockerfile
            target: release-mailtura-core
          - image_tag: mailtura-init
            dockerfile: docker/Dockerfile.init
            target: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Hub repository
        run: |
          if [ -z "${DOCKERHUB_REPOSITORY}" ]; then
            echo "vars.DOCKERHUB_REPOSITORY is not set"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.image.image_tag }} (${{ matrix.arch }}, with target)
        if: ${{ matrix.image.target != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.DOCKERHUB_REPOSITORY }}:${{ matrix.image.image_tag }}-${{ matrix.arch }}

      - name: Build and push ${{ matrix.image.image_tag }} (${{ matrix.arch }}, without target)
        if: ${{ matrix.image.target == '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.DOCKERHUB_REPOSITORY }}:${{ matrix.image.image_tag }}-${{ matrix.arch }}

  publish-manifests:
    needs: build-and-push-arch
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image_tag:
          - mailtura-worker
          - mailtura-core
          - mailtura-init

    steps:
      - name: Validate Docker Hub repository
        run: |
          if [ -z "${DOCKERHUB_REPOSITORY}" ]; then
            echo "vars.DOCKERHUB_REPOSITORY is not set"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag "${DOCKERHUB_REPOSITORY}:${{ matrix.image_tag }}" \
            "${DOCKERHUB_REPOSITORY}:${{ matrix.image_tag }}-amd64" \
            "${DOCKERHUB_REPOSITORY}:${{ matrix.image_tag }}-arm64"
