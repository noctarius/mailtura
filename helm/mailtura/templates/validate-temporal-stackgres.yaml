{{- if and .Values.stackgres.enabled .Values.temporal.enabled -}}
{{- $expectedHost := .Values.stackgres.cluster.name | toString -}}
{{- $defaultSql := .Values.temporal.server.config.persistence.default.sql | default dict -}}
{{- $visibilitySql := .Values.temporal.server.config.persistence.visibility.sql | default dict -}}

{{- if ne (($defaultSql.host | default "") | toString) $expectedHost -}}
{{- fail (printf "Invalid configuration: temporal.server.config.persistence.default.sql.host must match stackgres.cluster.name (%s) when stackgres.enabled=true" $expectedHost) -}}
{{- end -}}
{{- if ne (($visibilitySql.host | default "") | toString) $expectedHost -}}
{{- fail (printf "Invalid configuration: temporal.server.config.persistence.visibility.sql.host must match stackgres.cluster.name (%s) when stackgres.enabled=true" $expectedHost) -}}
{{- end -}}
{{- if ne (($defaultSql.database | default "") | toString) "postgres" -}}
{{- fail "Invalid configuration: temporal.server.config.persistence.default.sql.database must be postgres when stackgres.enabled=true" -}}
{{- end -}}
{{- if ne (($visibilitySql.database | default "") | toString) "postgres" -}}
{{- fail "Invalid configuration: temporal.server.config.persistence.visibility.sql.database must be postgres when stackgres.enabled=true" -}}
{{- end -}}
{{- if ne (($defaultSql.schema | default "") | toString) "temporal" -}}
{{- fail "Invalid configuration: temporal.server.config.persistence.default.sql.schema must be temporal when stackgres.enabled=true" -}}
{{- end -}}
{{- if ne (($visibilitySql.schema | default "") | toString) "temporal" -}}
{{- fail "Invalid configuration: temporal.server.config.persistence.visibility.sql.schema must be temporal when stackgres.enabled=true" -}}
{{- end -}}
{{- end -}}

{{- if and .Values.temporal.enabled .Values.temporal.server.config.namespaces.create -}}
{{- $mailturaNamespace := .Values.env.temporal.namespace | toString -}}
{{- $namespaces := .Values.temporal.server.config.namespaces.namespace | default list -}}
{{- $found := dict "value" false -}}
{{- range $ns := $namespaces -}}
{{- if eq (($ns.name | default "") | toString) $mailturaNamespace -}}
{{- $_ := set $found "value" true -}}
{{- end -}}
{{- end -}}
{{- if not $found.value -}}
{{- fail (printf "Invalid configuration: env.temporal.namespace (%s) must be present in temporal.server.config.namespaces.namespace when temporal.server.config.namespaces.create=true" $mailturaNamespace) -}}
{{- end -}}
{{- end -}}
