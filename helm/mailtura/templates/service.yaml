apiVersion: v1
kind: Service
metadata:
  name: {{ include "mailtura.fullname" . }}
  labels:
    {{- include "mailtura.labels" . | nindent 4 }}
spec:
  type: {{ .Values.mailtura.service.type }}
  ports:
    - port: {{ .Values.mailtura.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "mailtura.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
