nameOverride: ""
fullnameOverride: ""

mailtura:
  replicaCount: 1
  image:
    repository: docker.io/noctarius2k/mailtura
    tag: mailtura-core
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 3333
  resources: {}
  podAnnotations: {}
  podLabels: {}

worker:
  replicaCount: 1
  image:
    repository: docker.io/noctarius2k/mailtura
    tag: mailtura-worker
    pullPolicy: Always
  resources: {}
  podAnnotations: {}
  podLabels: {}

migrations:
  enabled: true
  image:
    repository: docker.io/noctarius2k/mailtura
    tag: mailtura-init
    pullPolicy: Always
  backoffLimit: 3
  activeDeadlineSeconds: 300

env:
  mailturaAuthSecret: "change-me"
  temporal:
    namespace: "default"
    taskQueue: "mailtura"
    address: ""
  apiBaseUrl: ""

externalDatabase:
  enabled: false
  url: ""

# StackGres operator dependency values
stackgresOperator: {}

# StackGres resources managed by this chart
stackgres:
  enabled: true
  cluster:
    name: &stackgresHost "stackgres"
    instances: 1
    postgres:
      version: "18"
    storage:
      size: "8Gi"
      storageClass: ""
  credentials:
    superuser:
      username: &stackgresUser "postgres"
      password: &stackgresPassword "mailtura"
  instanceProfile:
    name: "mailtura-small"
    cpu: "500m"
    memory: "1Gi"
  database:
    name: &stackgresDatabase "postgres"

# Temporal subchart values
temporal:
  enabled: true
  fullnameOverride: temporal
  cassandra:
    enabled: false
  elasticsearch:
    enabled: false
  prometheus:
    enabled: false
  grafana:
    enabled: false
  server:
    replicaCount: 1
    config:
      namespaces:
        create: true
        namespace:
          - name: "default"
            retention: 3d
      persistence:
        default:
          driver: "sql"
          sql:
            driver: "postgres12"
            host: *stackgresHost
            port: 5432
            database: *stackgresDatabase
            schema: &temporalSchema "temporal"
            connectAttributes:
              search_path: *temporalSchema
            user: *stackgresUser
            password: *stackgresPassword
            maxConns: 20
            maxConnLifetime: "1h"
        visibility:
          driver: "sql"
          sql:
            driver: "postgres12"
            host: *stackgresHost
            port: 5432
            database: *stackgresDatabase
            schema: *temporalSchema
            connectAttributes:
              search_path: *temporalSchema
            user: *stackgresUser
            password: *stackgresPassword
            maxConns: 20
            maxConnLifetime: "1h"
  admintools:
    enabled: true
  web:
    enabled: true
  schema:
    createDatabase:
      enabled: false
